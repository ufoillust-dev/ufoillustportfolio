<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>uFoillust · Ilustración</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">

    <p class="tagline">Ilustrador · Portafolio</p>

      <!-- Cambia el correo y los enlaces por los tuyos -->
      <a href="mailto:tu@email.com">Email</a>

    </nav>
  </header>

  <!-- Carrusel horizontal -->
  <section class="carousel" aria-label="Galería de obras">
    <div class="carousel-track" id="track">
      
      <figure class="card">
        <img src="images/24 sin titulo_20260708205013.jpg" alt="Ilustración 1" loading="lazy">
        <figcaption>Ilustración 1 · 2025</figcaption>
      </figure>
      
      <figure class="card">
        <img src="images/HPNo73ZXgAAKdWO.jpg" alt="Ilustración 2" loading="lazy">

      <figure class="card">
        <img src="images/HU4E0AtXgAA0pxY.jpg" alt="Ilustración 3" loading="lazy">

      </figure>
      
      <figure class="card">
        <img src="images/HV9ndyfWcAA8tMa.jpg" alt="Ilustración 4" loading="lazy">
        <figcaption>Ilustración 4 · 2025</figcaption>
      </figure>
      
      <figure class="card">
        <img src="images/HVna838XQAAZ2dn.jpg" alt="Ilustración 5" loading="lazy">
        <figcaption>Ilustración 5 · 2025</figcaption>
      </figure>
      
      <figure class="card">
        <img src="images/HWYBWjfW8AAVYtH.jpg" alt="Ilustración 6" loading="lazy">
        <figcaption>Ilustración 6 · 2025</figcaption>
      </figure>

    </div>

    <button class="nav-btn prev" id="prev" aria-label="Anterior">‹</button>
    <button class="nav-btn next" id="next" aria-label="Siguiente">›</button>
  </section>

  <footer class="site-footer">
    <p>© 2026 uFoillust. Todos los derechos reservados.</p>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">×</button>
    <img src="" alt="" id="lightboxImg">
  </div>

  <script src="script.js"></script>
</body>
</html>
